apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golang-app-dev
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: golang-app=mehedi02/simple-go-server
    argocd-image-updater.argoproj.io/golang-app.pull-secret: pullsecret:argocd/dockerhub-secret
    argocd-image-updater.argoproj.io/golang-app.update-strategy: latest
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/mehedi-iut/simple-go-app.git
    targetRevision: test
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    # namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true